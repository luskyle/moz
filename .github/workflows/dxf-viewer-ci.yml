name: moz-dxf-viewer CI

on:
  push:
    paths:
      - 'plugins/vscode-dxf-viewer/**'
      - 'py/moz_cadview.py'
      - 'py/moz_cadio.py'
      - 'scripts/build_moz_cadio.sh'
      - '3rd/libdxfrw/moz/**'
      - '.github/workflows/dxf-viewer-ci.yml'
  pull_request:
    paths:
      - 'plugins/vscode-dxf-viewer/**'
      - 'py/moz_cadview.py'
      - 'py/moz_cadio.py'
      - 'scripts/build_moz_cadio.sh'
      - '3rd/libdxfrw/moz/**'
      - '.github/workflows/dxf-viewer-ci.yml'

jobs:
  build-and-smoke:
    # 三平台编译后端 + 直接库级冒烟（--model-json 读语料出模型）。
    # 不与 vsix/解包纠缠：打包与通用 vsix 校验统一由 pack job 承担。
    # Linux 用 ubuntu-22.04 守 glibc 2.35 基线（与 release 一致，见其注释）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            lib_file: libmozcadio.so
            python: python3
          - os: macos-latest
            platform: darwin
            lib_file: libmozcadio.dylib
            python: python3
          - os: windows-latest
            platform: win32
            lib_file: mozcadio.dll
            python: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++
      - name: Build the platform backend
        shell: bash
        run: bash scripts/build_moz_cadio.sh
      - name: Smoke the platform library, Windows leg
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PYTHONPATH = Join-Path $PWD 'py'
          $env:MOZ_CADIO_LIB = Join-Path $PWD 'build\lib\mozcadio.dll'
          $env:PYTHONUTF8 = '1'
          python --version
          Write-Output ("lib exists: " + (Test-Path $env:MOZ_CADIO_LIB))
          python -m moz_cadview 'corpus/dxf/three-dxf/sample__data__demo.dxf' --model-json 'model.json'
          python -c "import json; d=json.load(open('model.json')); assert d['items'] and d['layers']; print('smoke OK:', len(d['layers']), 'layers,', len(d['items']), 'items (mozcadio.dll)')"
      - name: Smoke the platform library, Unix leg
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PYTHONPATH=py PYTHONUTF8=1 \
          MOZ_CADIO_LIB="$(pwd)/build/lib/${{ matrix.lib_file }}" \
          ${{ matrix.python }} -m moz_cadview corpus/dxf/three-dxf/sample__data__demo.dxf \
            --model-json model.json
          ${{ matrix.python }} -c "import json; d=json.load(open('model.json')); \
            assert d['items'] and d['layers']; print('smoke OK:',
            len(d['layers']), 'layers,', len(d['items']), 'items',
            '(' + '${{ matrix.lib_file }}' + ')')"
      - name: Upload the platform backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.platform }}
          path: build/lib/${{ matrix.lib_file }}
          if-no-files-found: error
          retention-days: 1

  pack:
    # 合并三平台动态库打通用 vsix 并校验（结构与 release 的 pack 一致，
    # 所以每次 push 都能验证「一个包装到哪个平台都有对应后端」）。
    needs: build-and-smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/vscode-dxf-viewer/package-lock.json
      - name: npm ci
        working-directory: plugins/vscode-dxf-viewer
        run: npm ci
      - name: npm run compile
        working-directory: plugins/vscode-dxf-viewer
        run: npm run compile
      - name: Download the three platform backends
        uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: backend-artifacts
          merge-multiple: true
      - name: Merge backends and package the universal vsix
        shell: bash
        run: |
          mkdir -p build/lib
          cp backend-artifacts/* build/lib/
          cd plugins/vscode-dxf-viewer
          npm run package
      - name: Verify the vsix carries all three backends
        shell: bash
        working-directory: plugins/vscode-dxf-viewer
        run: |
          for lib in libmozcadio.so libmozcadio.dylib mozcadio.dll; do
            unzip -l *.vsix | grep -q "extension/python/moz_data/lib/$lib" \
              || (echo "缺少 $lib" && exit 1)
          done
          echo "通用 vsix 已带三平台后端"
      - name: Smoke the unpacked vsix on the Linux leg
        shell: bash
        run: |
          mkdir -p /tmp/vsix
          unzip -q -o "$(ls plugins/vscode-dxf-viewer/*.vsix)" -d /tmp/vsix
          PYTHONPATH=/tmp/vsix/extension/python \
          MOZ_CADIO_LIB=/tmp/vsix/extension/python/moz_data/lib/libmozcadio.so \
          python3 -m moz_cadview corpus/dxf/three-dxf/sample__data__demo.dxf \
            --model-json /tmp/model.json
          python3 -c "import json; d=json.load(open('/tmp/model.json')); \
            assert d['items'] and d['layers']; print('universal vsix smoke OK')"

      # IMAGE 像素内嵌是纯 Python 通路（无 Qt 也能出 raster），单独钉住
      - name: IMAGE raster smoke
        shell: bash
        run: |
          PYTHONPATH=py MOZ_CADIO_LIB="$(pwd)/build/lib/libmozcadio.so" \
          python3 -m moz_cadview corpus/dxf/ezdxf/examples_dxf__image__images.dxf \
            --model-json /tmp/images.json
          python3 - <<'EOF'
          import json
          data = json.load(open('/tmp/images.json'))
          images = [i for i in data['items'] if i['kind'] == 'IMAGE']
          assert images, '语料应有 IMAGE 实体'
          rendered = [i for i in images if i.get('raster', '').startswith('data:image/')]
          assert rendered, 'IMAGE 应内嵌图片像素（data URL）'
          assert all(len(i['corners']) == 6 for i in rendered), 'IMAGE 缺外框 corners'
          print(f"IMAGE raster 冒烟 OK：{len(rendered)}/{len(images)} 张内嵌像素")
          EOF