name: moz-dxf-viewer CI

on:
  push:
    paths:
      - 'plugins/vscode-dxf-viewer/**'
      - 'py/moz_cadview.py'
      - 'py/moz_cadio.py'
      - 'scripts/build_moz_cadio.sh'
      - '3rd/libdxfrw/moz/**'
      - '.github/workflows/dxf-viewer-ci.yml'
  pull_request:
    paths:
      - 'plugins/vscode-dxf-viewer/**'
      - 'py/moz_cadview.py'
      - 'py/moz_cadio.py'
      - 'scripts/build_moz_cadio.sh'
      - '3rd/libdxfrw/moz/**'
      - '.github/workflows/dxf-viewer-ci.yml'

jobs:
  build-and-smoke:
    # 平台矩阵：三平台都能编译自己的后端 + 打 vsix + 解包冒烟。
    # Linux 用 ubuntu-22.04 守 glibc 2.35 基线（与 release 一致，见其注释）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            lib_file: libmozcadio.so
            python: python3
          - os: macos-latest
            platform: darwin
            lib_file: libmozcadio.dylib
            python: python3
          - os: windows-latest
            platform: win32
            lib_file: mozcadio.dll
            python: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # --- 扩展本体：类型检查 ---
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/vscode-dxf-viewer/package-lock.json
      - name: npm ci
        working-directory: plugins/vscode-dxf-viewer
        run: npm ci
      - name: npm run compile
        working-directory: plugins/vscode-dxf-viewer
        run: npm run compile

      # --- 编译 C 后端（macOS/Windows runner 自带 cmake + 编译器；Linux 补装） ---
      - name: Install build tools (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++
      - name: Build the platform backend
        shell: bash
        run: bash scripts/build_moz_cadio.sh

      # --- 打成 vsix（bundle-backend 把 py 后端 + 本平台动态库拷进 python/） ---
      - name: npm run package（产出 vsix）
        working-directory: plugins/vscode-dxf-viewer
        run: npm run package
      - name: 校验 vsix 已生成且内置 python/ + 本平台后端
        shell: bash
        working-directory: plugins/vscode-dxf-viewer
        run: |
          test -n "$(ls *.vsix 2>/dev/null)" || (echo '没有产出 .vsix' && exit 1)
          unzip -l *.vsix | grep -q 'extension/python/moz_cadview.py'
          unzip -l *.vsix | grep -q "extension/python/moz_data/lib/${{ matrix.lib_file }}"
          echo "vsix 内已带自带后端（py + ${{ matrix.lib_file }}）"

      # --- 端到端：用解包后的自带后端跑 --model-json（扩展的实际调用方式） ---
      - name: 解包 vsix 用自带 python/ 端到端冒烟
        shell: bash
        run: |
          mkdir -p /tmp/vsix
          unzip -q -o "$(ls plugins/vscode-dxf-viewer/*.vsix)" -d /tmp/vsix
          PYTHONPATH=/tmp/vsix/extension/python \
          MOZ_CADIO_LIB=/tmp/vsix/extension/python/moz_data/lib/${{ matrix.lib_file }} \
          ${{ matrix.python }} -m moz_cadview corpus/dxf/three-dxf/sample__data__demo.dxf \
            --model-json /tmp/model.json
          ${{ matrix.python }} - <<'EOF'
          import json
          data = json.load(open('/tmp/model.json'))
          assert data['items'] and data['layers'], f"模型为空：items={len(data['items'])}"
          assert any(item['kind'] == 'LINE' for item in data['items']), '没有 LINE 图元'
          assert all(item.get('color', '').startswith('#') for item in data['items']), \
              '图元应带算好的颜色'
          texts = [item for item in data['items'] if item.get('text')]
          assert texts and all('pos' in t and 'h' in t for t in texts), 'TEXT/MTEXT 缺 pos/h'
          print(f"端到端 OK：format={data['format']} {data['version']}，"
                f"{len(data['layers'])} 图层、{len(data['items'])} 图元、"
                f"{len(texts)} 条文字（自带后端）")
          EOF

      # IMAGE 的像素内嵌是纯 Python 通路（无 Qt 也能出 raster），必须钉住
      - name: IMAGE 像素内嵌冒烟（--model-json 自带后端）
        shell: bash
        run: |
          PYTHONPATH=/tmp/vsix/extension/python \
          MOZ_CADIO_LIB=/tmp/vsix/extension/python/moz_data/lib/${{ matrix.lib_file }} \
          ${{ matrix.python }} -m moz_cadview corpus/dxf/ezdxf/examples_dxf__image__images.dxf \
            --model-json /tmp/images.json
          ${{ matrix.python }} - <<'EOF'
          import json
          data = json.load(open('/tmp/images.json'))
          images = [i for i in data['items'] if i['kind'] == 'IMAGE']
          assert images, '语料应有 IMAGE 实体'
          rendered = [i for i in images if i.get('raster', '').startswith('data:image/')]
          assert rendered, 'IMAGE 应内嵌图片像素（data URL）'
          assert all(len(i['corners']) == 6 for i in rendered), 'IMAGE 缺外框 corners'
          print(f"IMAGE raster 冒烟 OK：{len(rendered)}/{len(images)} 张内嵌像素")
          EOF