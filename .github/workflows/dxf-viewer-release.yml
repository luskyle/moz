name: moz-dxf-viewer Release

"on":
  push:
    tags:
      - 'vscode-dxf-viewer-v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/vscode-dxf-viewer/package-lock.json
      - name: npm ci
        working-directory: plugins/vscode-dxf-viewer
        run: npm ci
      - name: TypeScript compile
        working-directory: plugins/vscode-dxf-viewer
        run: npm run compile
      - name: Build C backend and package the vsix (bundled backend in)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++
          bash scripts/build_moz_cadio.sh
          cd plugins/vscode-dxf-viewer
          npm run package
      - name: Verify vsix carries python/, .so and icon.png
        working-directory: plugins/vscode-dxf-viewer
        run: |
          test -n "$(ls *.vsix)" || (echo 'vsix not produced' && exit 1)
          unzip -l *.vsix | grep -q 'extension/python/moz_data/lib/libmozcadio.so'
          unzip -l *.vsix | grep -q 'extension/icon.png'
          echo 'vsix carries the bundled backend and icon'

      # The tag push auto-creates the GitHub Release; attach the vsix there so
      # manual installs stay possible even without a Marketplace token.
      - name: Attach vsix to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: plugins/vscode-dxf-viewer/moz-dxf-viewer-*.vsix
          generate_release_notes: true

      # Marketplace publishing follows the official pattern: the deploy script
      # (package.json) contains no token.  The secrets context is NOT allowed
      # inside `if:`, so the token is read into a step env first and its
      # presence is reported via step output; "no token -> skip" is decided on
      # that output.  Set the encrypted secret VSCE_PAT at Settings -> Secrets
      # and variables -> Actions (a VS Code Marketplace PAT from the Azure
      # DevOps tokens page, publisher luskyle).
      - name: Detect Marketplace token
        id: has_token
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - name: Publish to VS Code Marketplace
        if: ${{ success() && startsWith(github.ref, 'refs/tags/') && steps.has_token.outputs.present == 'true' }}
        working-directory: plugins/vscode-dxf-viewer
        run: npm run deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}