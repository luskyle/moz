name: moz-dxf-viewer Release

"on":
  push:
    tags:
      - 'vscode-dxf-viewer-v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    # 三平台各自编译自己的 libmozcadio 动态库（.so/.dylib/.dll）并直接冒烟，
    # 然后作为 artifact 交给 pack job 合并成通用 vsix。
    # Linux 用 ubuntu-22.04 守 glibc 2.35 兼容基线（ubuntu-latest=24.04 编出的
    # .so 要求 GLIBC_2.38，装到 22.04 系机器会加载失败——0.2.2 上线时就炸过）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            lib_file: libmozcadio.so
            python: python3
          - os: macos-latest
            platform: darwin
            lib_file: libmozcadio.dylib
            python: python3
          - os: windows-latest
            platform: win32
            lib_file: mozcadio.dll
            python: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++
      - name: Build the platform backend
        shell: bash
        run: bash scripts/build_moz_cadio.sh
      - name: Smoke the platform library, Windows leg
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PYTHONPATH = Join-Path $PWD 'py'
          $env:MOZ_CADIO_LIB = Join-Path $PWD 'build\lib\mozcadio.dll'
          $env:PYTHONUTF8 = '1'
          python --version
          Write-Output ("lib exists: " + (Test-Path $env:MOZ_CADIO_LIB))
          python -m moz_cadview 'corpus/dxf/three-dxf/sample__data__demo.dxf' --model-json 'model.json'
          python -c "import json; d=json.load(open('model.json')); assert d['items'] and d['layers']; print('smoke OK:', len(d['layers']), 'layers,', len(d['items']), 'items (mozcadio.dll)')"
      - name: Smoke the platform library, Unix leg
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PYTHONPATH=py PYTHONUTF8=1 \
          MOZ_CADIO_LIB="$(pwd)/build/lib/${{ matrix.lib_file }}" \
          ${{ matrix.python }} -m moz_cadview corpus/dxf/three-dxf/sample__data__demo.dxf \
            --model-json model.json
          ${{ matrix.python }} -c "import json; d=json.load(open('model.json')); \
            assert d['items'] and d['layers']; print('smoke OK:',
            len(d['layers']), 'layers,', len(d['items']), 'items')"
      - name: Upload the platform backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.platform }}
          path: build/lib/${{ matrix.lib_file }}
          if-no-files-found: error
          retention-days: 1

  pack:
    # 合并三个平台的动态库进一个**通用 vsix**：运行时（moz_cadio.py / backend.ts）
    # 按当前平台选库名，所以一个包装到 Linux/macOS/Windows 都能跑。
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/vscode-dxf-viewer/package-lock.json
      - name: npm ci
        working-directory: plugins/vscode-dxf-viewer
        run: npm ci
      - name: TypeScript compile
        working-directory: plugins/vscode-dxf-viewer
        run: npm run compile
      - name: Download the three platform backends
        uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: backend-artifacts
          merge-multiple: true
      - name: Merge backends into build/lib and package the universal vsix
        shell: bash
        run: |
          mkdir -p build/lib
          cp backend-artifacts/* build/lib/
          ls -la build/lib/
          cd plugins/vscode-dxf-viewer
          npm run package
      - name: Verify the vsix carries all three backends and the icon
        shell: bash
        working-directory: plugins/vscode-dxf-viewer
        run: |
          test -n "$(ls *.vsix)" || (echo 'vsix not produced' && exit 1)
          for lib in libmozcadio.so libmozcadio.dylib mozcadio.dll; do
            unzip -l *.vsix | grep -q "extension/python/moz_data/lib/$lib" \
              || (echo "缺少 $lib" && exit 1)
          done
          unzip -l *.vsix | grep -q 'extension/icon.png'
          echo "vsix 已带三平台后端 + 图标"
      - name: Smoke the unpacked vsix on the Linux leg
        shell: bash
        run: |
          mkdir -p /tmp/vsix
          unzip -q -o "$(ls plugins/vscode-dxf-viewer/*.vsix)" -d /tmp/vsix
          PYTHONPATH=/tmp/vsix/extension/python \
          MOZ_CADIO_LIB=/tmp/vsix/extension/python/moz_data/lib/libmozcadio.so \
          python3 -m moz_cadview corpus/dxf/three-dxf/sample__data__demo.dxf \
            --model-json /tmp/model.json
          python3 -c "import json; d=json.load(open('/tmp/model.json')); \
            assert d['items'] and d['layers']; print('universal vsix smoke OK')"

      # The tag push auto-creates the GitHub Release; attach the universal
      # vsix there for manual installs on every OS.
      - name: Attach vsix to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: plugins/vscode-dxf-viewer/moz-dxf-viewer-*.vsix
          generate_release_notes: true

      # Marketplace publishing: the universal vsix works on every platform, so
      # a single deploy serves all OSes.  The deploy script (package.json)
      # contains no token; the secrets context is not allowed inside if:, so
      # token presence is detected via step env + output.  The encrypted
      # secret is named LUSKYLE.
      - name: Detect Marketplace token
        id: has_token
        env:
          VSCE_PAT: ${{ secrets.LUSKYLE }}
        run: |
          if [ -n "$VSCE_PAT" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - name: Publish to VS Code Marketplace
        if: ${{ success() && startsWith(github.ref, 'refs/tags/') && steps.has_token.outputs.present == 'true' }}
        working-directory: plugins/vscode-dxf-viewer
        run: npm run deploy
        env:
          VSCE_PAT: ${{ secrets.LUSKYLE }}