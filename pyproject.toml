[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moz-openscad"
version = "0.1.0"
description = "Python API and interactive viewer for the headless OpenSCAD core"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PySide6>=6.5",
]

[tool.setuptools]
package-dir = {"" = "py"}
py-modules = ["moz_openscad", "moz_viewer", "moz_drawing", "moz_dxf", "demo"]
# moz_data 只放运行时数据（配色方案、字体、MCAD 库、示例数据、预编译 .so）
packages = ["moz_data"]
include-package-data = true

# wheel 里要带的数据；lib/ 下的 libmozopenscad.so 由 scripts/build_wheel.sh 拷进来
[tool.setuptools.package-data]
# 顶层模块的类型存根（PEP 561）：要和 moz_openscad.py 一起放到 wheel 根目录
"*" = ["*.pyi"]
moz_data = [
    "color-schemes/*",
    "color-schemes/render/*",
    "color-schemes/editor/*",
    "fonts/*",
    "fonts/Liberation-2.00.1/*",
    "fonts/Liberation-2.00.1/ttf/*",
    "libraries/MCAD/*",
    "examples/Basics/*",
    "examples/Advanced/*",
    "examples/Parametric/*",
    "examples/Old/*",
    "drawings/*",
    "lib/*",
]

[project.scripts]
moz-demo = "demo:main"
moz-viewer = "moz_viewer:main"

[project.optional-dependencies]
test = ["pytest>=7", "ezdxf>=1.0"]
# 重新生成字库/字形表（scripts/make_cjk_subset_font.py、scripts/gen_mcad_polyfont.py）用
tools = ["fonttools>=4.0"]
# 图纸 → 模型（py/moz_dxf.py，P1）：纯 Python 的 DXF 解析库（MIT）
dxf = ["ezdxf>=1.0"]

[tool.pytest.ini_options]
testpaths = ["py/tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
# 3rd/ 是 vendored 的 OpenSCAD 源码；py/examples/ 刻意照上游 .scad 的排版（制表符、长行）翻译
extend-exclude = ["3rd", "build", "py/examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # 形状原语的可变默认值（size=[1,1,1]）与 SCAD 的签名一致，且从不被修改
    "B006",
]

[tool.ruff.lint.per-file-ignores]
# 存根里的长签名不拆行更好读
"*.pyi" = ["E501"]
