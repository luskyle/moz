[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moz-openscad"
version = "0.1.0"
description = "Python API and interactive viewer for the headless OpenSCAD core"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PySide6>=6.5",
]

[tool.setuptools]
package-dir = {"" = "py"}
py-modules = ["moz_openscad", "moz_viewer", "demo"]

[project.scripts]
moz-demo = "demo:main"
moz-viewer = "moz_viewer:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["py/tests"]
